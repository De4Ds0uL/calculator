<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel = "stylesheet" href="style.css">
    <script src="script.js"></script>
</head>

<body>
    <div id = "input">
        <div id = "output"></div>
        <div class = "flexbox">
            <div id="clear"><input type ="button" onclick="functions('C')" value="C" class = "grey"></div>
            <span id = "."><input type="button" onclick = "functions('.')" value = "." class = "grey"></span>
            <div id="%"><input type ="button" onclick="functions('%')" value="%" class = "grey"></div>
            <div id="/"><input type ="button" onclick="functions('÷')" value="÷" class = "yellow"></div>
        </div>
        <div class = "flexbox">
            <div id="number7"><input type="button" onclick="functions('7')" value="7" class="dark"></div>
            <div id="number8"><input type="button" onclick="functions('8')" value="8" class="dark"></div>
            <div id="number9"><input type="button" onclick="functions('9')" value="9" class="dark"></div>
            <div id="multiply"><input type ="button" onclick="functions('*')" value="x" class="yellow"></div>
        </div>
        <div class = "flexbox">
            <div id="number4"><input type="button" onclick="functions('4')" value="4" class="dark"></div>
            <div id="number5"><input type="button" onclick="functions('5')" value="5" class="dark"></div>
            <div id="number6"><input type="button" onclick="functions('6')" value="6" class="dark"></div>
            <div id="minus"><input type ="button" onclick="functions('-')" value="-" class = "yellow"></div>
        </div>
        <div class = "flexbox">
            <div id="number1"><input type="button" onclick="functions('1')" value="1" class="dark"></div>
            <div id="number2"><input type="button" onclick="functions('2')" value="2" class="dark"></div>
            <div id="number3"><input type="button" onclick="functions('3')" value="3" class="dark"></div>
            <div id="plus"><input type ="button" onclick="functions('+')" value="+" class = "yellow"></div>
        </div>
        <div class = "flexbox">
            <div id = "number0"><input type="button" onclick = "functions('0')" value = "0" class = "dark"></div>
            <div id = "."><input type="button" onclick = "functions('AC')" value = "AC" class = "dark"></div>
            <div id = "="><input type="button" onclick = "functions('=')" value = "=" class = "yellow"></div>
        </div>
    </div>
</body>
</html>
